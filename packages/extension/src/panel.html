<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --chip: #f6f8fa; --accent: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1f2328; --fg: #e6edf3; --muted: #8d96a0; --line: #3d444d; --chip: #2d333b; --accent: #4493f8; }
      }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
      .card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); }
      header b { font-weight: 600; }
      header small { color: var(--muted); font-size: 12px; }
      header button { margin-left: auto; }
      ul { list-style: none; margin: 0; padding: 4px 0; max-height: 236px; overflow: auto; }
      li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 8px 5px 12px; }
      code { font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); background: var(--chip); padding: 0 5px; border-radius: 5px; }
      .value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      button { font: inherit; font-size: 12px; color: var(--fg); background: transparent; border: 1px solid var(--line);
        border-radius: 6px; padding: 2px 8px; cursor: pointer; }
      button:hover, button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
      .pill { display: block; width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; text-align: left; background: var(--bg); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="panel.js"></script>
  </body>
</html>
