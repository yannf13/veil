<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Veil</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --soft: #f6f8fa; --accent: #0969da;
        --ok: #1a7f37; --warn: #bc4c00; --err: #cf222e;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1f2328; --fg: #e6edf3; --muted: #8d96a0; --line: #3d444d; --soft: #2d333b; --accent: #4493f8;
          --ok: #3fb950; --warn: #db6d28; --err: #f85149; }
      }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; }
      body { width: 340px; }
      header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      header img { width: 24px; height: 24px; }
      header b { font-size: 15px; font-weight: 650; }
      section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
      section:last-of-type { border-bottom: 0; }
      h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      p { margin: 0; }
      .muted { color: var(--muted); }
      .status { display: flex; align-items: center; gap: 10px; }
      .status p { flex: 1; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.ok { background: var(--ok); } .dot.blind { background: var(--warn); }
      .warn { margin-top: 8px; color: var(--warn); }
      .switch { position: relative; width: 34px; height: 20px; flex: none; }
      .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
      .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--line); transition: background .15s; pointer-events: none; }
      .switch span::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
      .switch input:checked + span { background: var(--ok); }
      .switch input:checked + span::after { transform: translateX(14px); }
      .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
      .switch input:disabled + span { opacity: .5; }
      .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
      .kinds label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
      .kinds input:disabled + span { color: var(--muted); }
      textarea { box-sizing: border-box; width: 100%; min-height: 54px; resize: vertical; padding: 6px 8px; border: 1px solid var(--line);
        border-radius: 6px; background: var(--soft); color: var(--fg); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
      .hint { margin: 4px 0 8px; font-size: 12px; color: var(--muted); }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      button { font: inherit; font-size: 12px; color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #saved { font-size: 12px; color: var(--ok); }
      .problems { margin: 6px 0 0; padding-left: 18px; color: var(--err); font-size: 12px; }
      footer { padding: 10px 14px; font-size: 12px; color: var(--muted); background: var(--soft); }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <b>Veil</b>
    </header>
    <section aria-labelledby="h-site">
      <h2 id="h-site">This page</h2>
      <div class="status">
        <span class="dot" id="dot"></span>
        <p id="site-line">Checking this page…</p>
        <label class="switch" id="switch" hidden>
          <input type="checkbox" id="site-on" aria-label="Veil on this site" />
          <span></span>
        </label>
      </div>
      <p class="warn" id="site-warn" hidden></p>
    </section>
    <section aria-labelledby="h-audit">
      <h2 id="h-audit">Hidden in the last 30 days</h2>
      <p id="audit">Nothing yet.</p>
    </section>
    <section aria-labelledby="h-kinds">
      <h2 id="h-kinds">What to hide</h2>
      <div class="kinds" id="kinds"></div>
    </section>
    <section aria-labelledby="h-rules">
      <h2 id="h-rules">Your rules</h2>
      <label for="allow"><b>Always show</b></label>
      <p class="hint">One per line: exact text, <code>*@yourcompany.com</code>, or <code>/regex/</code>.</p>
      <textarea id="allow" spellcheck="false" placeholder="support@yourcompany.com"></textarea>
      <label for="patterns"><b>Also hide</b></label>
      <p class="hint">One per line: a name in capitals, then a regular expression.</p>
      <textarea id="patterns" spellcheck="false" placeholder="PROJECT PRJ-\d{4}"></textarea>
      <ul class="problems" id="problems" hidden></ul>
      <div class="row"><button id="save" type="button">Save rules</button><span id="saved" role="status"></span></div>
    </section>
    <footer id="footer">Everything stays on this device. Veil never sends your text anywhere.</footer>
    <script src="popup.js"></script>
  </body>
</html>
